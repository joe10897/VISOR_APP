<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: gap: cdvfile: https://ssl.gstatic.com 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' ; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>V.I.S.O.R. MK-XXV | 技術展示</title>

    <script src="lib/js/tailwindcss.js"></script>
    <script src="lib/js/react.min.js"></script>
    <script src="lib/js/react-dom.min.js"></script>
    <script src="lib/js/lucide.min.js"></script>
    <script src="lib/js/babel.min.js"></script>

    <style>
        .font-pixel {
            font-family: 'Courier New', Courier, monospace;
            letter-spacing: 1px;
        }

        /* ============ 循環動畫核心區 ============ */
        @keyframes an-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes an-spin-rev {
            to {
                transform: rotate(-360deg);
            }
        }

        .an-spin-slow {
            animation: an-spin 14s linear infinite;
        }

        .an-spin-slower {
            animation: an-spin 26s linear infinite;
        }

        .an-spin-rev {
            animation: an-spin-rev 9s linear infinite;
        }

        @keyframes an-radar {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .an-radar {
            animation: an-radar 2.2s linear infinite;
        }

        @keyframes an-scan {
            0% {
                top: -12%;
                opacity: 0;
            }
            8% {
                opacity: 1;
            }
            92% {
                opacity: 1;
            }
            100% {
                top: 108%;
                opacity: 0;
            }
        }

        .an-scan {
            animation: an-scan 2.4s linear infinite;
        }

        @keyframes an-flow-x {
            0% {
                left: -6%;
                opacity: 0;
            }
            12% {
                opacity: 1;
            }
            88% {
                opacity: 1;
            }
            100% {
                left: 104%;
                opacity: 0;
            }
        }

        .an-flow-x {
            animation: an-flow-x 2.2s linear infinite;
        }

        @keyframes an-flow-y {
            0% {
                top: -8%;
                opacity: 0;
            }
            12% {
                opacity: 1;
            }
            88% {
                opacity: 1;
            }
            100% {
                top: 104%;
                opacity: 0;
            }
        }

        .an-flow-y {
            animation: an-flow-y 1.8s linear infinite;
        }

        @keyframes an-ring {
            0% {
                transform: scale(0.5);
                opacity: 0.85;
            }
            100% {
                transform: scale(1.65);
                opacity: 0;
            }
        }

        .an-ring {
            animation: an-ring 1.8s ease-out infinite;
        }

        @keyframes an-blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.12;
            }
        }

        .an-blink {
            animation: an-blink 1.1s ease-in-out infinite;
        }

        @keyframes an-floaty {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-7px);
            }
        }

        .an-floaty {
            animation: an-floaty 3.4s ease-in-out infinite;
        }

        @keyframes an-node {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.55);
            }
            70% {
                box-shadow: 0 0 0 9px rgba(34, 211, 238, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(34, 211, 238, 0);
            }
        }

        .an-node {
            animation: an-node 2.1s ease-out infinite;
        }

        @keyframes an-threat {
            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.88);
            }
            50% {
                opacity: 1;
                transform: scale(1.06);
            }
        }

        .an-threat {
            animation: an-threat 1.6s ease-in-out infinite;
        }

        @keyframes an-shimmer {
            from {
                background-position: -200% 0;
            }
            to {
                background-position: 200% 0;
            }
        }

        .an-shimmer {
            background: linear-gradient(100deg,
                    rgba(34, 211, 238, 0.25) 30%,
                    rgba(103, 232, 249, 0.65) 50%,
                    rgba(34, 211, 238, 0.25) 70%);
            background-size: 200% 100%;
            animation: an-shimmer 2.4s linear infinite;
        }

        @keyframes an-danger {
            0%,
            100% {
                background-color: rgba(127, 29, 29, 0.9);
            }
            50% {
                background-color: rgba(220, 38, 38, 0.9);
            }
        }

        .an-danger {
            animation: an-danger 0.5s infinite;
        }

        @keyframes an-ticker {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(-100%);
            }
        }

        .an-ticker {
            animation: an-ticker 9s linear infinite;
        }

        @keyframes an-bar-pulse {
            0%,
            100% {
                transform: scaleY(1);
            }
            50% {
                transform: scaleY(1.12);
            }
        }

        @keyframes an-fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .an-fade-in {
            animation: an-fade-in 0.6s ease-out both;
        }

        .card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(51, 65, 85, 0.7);
            border-radius: 1rem;
        }

        .card-glow:hover {
            border-color: rgba(34, 211, 238, 0.45);
            box-shadow: 0 0 24px rgba(34, 211, 238, 0.08);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .typing-cursor::after {
            content: '|';
            animation: an-blink 0.9s infinite;
            color: #22d3ee;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body class="bg-black text-white font-sans selection:bg-cyan-500 selection:text-black overflow-x-hidden">

    <div id="debug-console"
        class="fixed top-0 left-0 w-full h-1/2 bg-black/90 text-[10px] font-mono p-2 overflow-y-auto z-[1000] border-b border-red-500 hidden pointer-events-none">
        <div class="text-red-500 font-bold mb-1 underline">SYSTEM LOG:</div>
    </div>

    <!-- 開機畫面 -->
    <div id="visor-boot-screen"
        class="fixed inset-0 z-[999] bg-black flex flex-col items-center justify-center transition-opacity duration-1000">
        <div class="relative w-64 h-64 flex items-center justify-center">
            <div class="absolute inset-0 border-4 border-cyan-500/20 rounded-full"></div>
            <div class="absolute inset-0 border-4 border-t-cyan-400 rounded-full animate-spin" style="animation-duration: 2s;"></div>
            <div class="absolute inset-4 border-2 border-b-cyan-600 rounded-full animate-spin" style="animation-duration: 3s; animation-direction: reverse;"></div>
            <div class="text-center animate-pulse">
                <div class="text-cyan-400 font-black text-2xl italic tracking-tighter">V.I.S.O.R.</div>
                <div class="text-cyan-600 text-[10px] font-mono mt-1 uppercase tracking-[0.2em]">MK-XXV OS</div>
            </div>
        </div>
        <div class="mt-12 w-48 h-1 bg-slate-900 rounded-full overflow-hidden border border-cyan-900/30">
            <div id="boot-progress-bar" class="h-full bg-cyan-500 shadow-[0_0_10px_#22d3ee] transition-all duration-300" style="width: 0%"></div>
        </div>
        <div id="boot-status" class="mt-4 text-cyan-500/70 text-[10px] font-mono tracking-widest uppercase h-4">INITIALIZING CORE...</div>
        <div class="absolute inset-0 opacity-10 pointer-events-none"
            style="background-image: linear-gradient(#22d3ee 1px, transparent 1px), linear-gradient(90deg, #22d3ee 1px, transparent 1px); background-size: 30px 30px;">
        </div>
    </div>

    <div id="root"></div>

    <script>
        const debugConsole = document.getElementById('debug-console');
        let clickCount = 0;
        document.addEventListener('click', (e) => {
            if (e.clientX < 50 && e.clientY < 50) {
                clickCount++;
                if (clickCount >= 5) {
                    debugConsole.classList.toggle('hidden');
                    debugConsole.classList.toggle('pointer-events-auto');
                    clickCount = 0;
                }
            }
        });
        const logToScreen = (msg, isError = false) => {
            const c = document.getElementById('debug-console');
            if (c) {
                const entry = document.createElement('div');
                entry.className = isError ? 'text-red-400' : 'text-slate-300';
                entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
                c.appendChild(entry);
            }
            console.log(msg);
        };
        window.onerror = (msg, url, line) => {
            logToScreen(`ERR: ${msg} (at ${line})`, true);
            return false;
        };
        logToScreen("V.I.S.O.R. Tech Showcase Loader Initialized");
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ================================================================
        // 共用元件
        // ================================================================
        const toPascalCase = (str) => str.replace(/(^\w|-\w)/g, (text) => text.replace(/-/, '').toUpperCase());
        const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (!window.lucide || !containerRef.current) return;
                const iconNode = window.lucide.icons[toPascalCase(name)];
                if (!iconNode) return;
                const svgElement = window.lucide.createElement(iconNode);
                svgElement.setAttribute('width', size);
                svgElement.setAttribute('height', size);
                if (className) svgElement.setAttribute('class', className);
                if (strokeWidth) svgElement.setAttribute('stroke-width', strokeWidth);
                containerRef.current.innerHTML = '';
                containerRef.current.appendChild(svgElement);
            }, [name, size, className, strokeWidth]);
            return <span ref={containerRef} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', lineHeight: 0 }}></span>;
        };

        const SectionTitle = ({ zh, en, icon }) => (
            <div className="flex items-center gap-3 mb-5 mt-12">
                <div className="w-1.5 h-8 rounded-full bg-gradient-to-b from-cyan-400 to-cyan-600 shadow-[0_0_10px_#22d3ee]"></div>
                <Icon name={icon} size={22} className="text-cyan-400" />
                <div>
                    <h2 className="text-lg md:text-xl font-black tracking-wide">{zh}</h2>
                    <p className="text-[9px] font-mono text-slate-500 uppercase tracking-[0.25em]">{en}</p>
                </div>
            </div>
        );

        const CardHeader = ({ icon, zh, en, live = false }) => (
            <div className="flex items-center justify-between mb-4 shrink-0">
                <div className="flex items-center gap-2.5">
                    <div className="w-9 h-9 rounded-lg bg-cyan-900/30 border border-cyan-500/30 flex items-center justify-center">
                        <Icon name={icon} size={17} className="text-cyan-400" />
                    </div>
                    <div>
                        <h3 className="text-sm font-bold leading-tight">{zh}</h3>
                        <p className="text-[8px] font-mono text-slate-500 uppercase tracking-widest">{en}</p>
                    </div>
                </div>
                {live && (
                    <span className="flex items-center gap-1.5 text-[9px] font-mono text-cyan-400 border border-cyan-500/30 bg-cyan-900/20 rounded-full px-2 py-0.5">
                        <span className="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>LIVE LOOP
                    </span>
                )}
            </div>
        );

        // ================================================================
        // 示範數據循環 (模擬騎士行車情境)
        // ================================================================
        const DEMO_CYCLE = [
            { name: '巡航中', speed: 64, tilt: 14, braking: 3, score: 93, fps: 21, latency: 42 },
            { name: '加速中', speed: 84, tilt: 25, braking: 2, score: 89, fps: 22, latency: 44 },
            { name: '超速事件', speed: 108, tilt: 12, braking: 4, score: 77, fps: 20, latency: 48 },
            { name: '急煞事件', speed: 92, tilt: 18, braking: 14, score: 64, fps: 19, latency: 47 },
            { name: '危險傾角', speed: 76, tilt: 44, braking: 5, score: 51, fps: 18, latency: 50 },
        ];
        const LIMIT = 60;

        // ================================================================
        // Hero：軌道核心
        // ================================================================
        const HeroSection = ({ demo }) => {
            const isOver = demo.speed > LIMIT;
            const statusColor = isOver ? 'text-red-400' : 'text-cyan-400';
            const statusText = isOver ? `⚠ ${demo.name} (超速 ${demo.speed - LIMIT} km/h)` : `${demo.name} · 時速正常`;
            const stats = [
                { icon: 'gauge', label: 'YOLOv26n 推論', value: demo.fps, unit: 'FPS', color: 'text-cyan-400' },
                { icon: 'zap', label: '端到端延遲', value: demo.latency, unit: 'ms', color: 'text-yellow-300' },
                { icon: 'cpu', label: '模型參數', value: '2.6', unit: 'M', color: 'text-emerald-400' },
                { icon: 'target', label: 'mAP@50', value: '.349', unit: '', color: 'text-fuchsia-400' },
            ];
            return (
                <div className="relative pt-12 pb-6 text-center overflow-hidden">
                    <div className="absolute inset-0 opacity-[0.06] pointer-events-none"
                        style={{ backgroundImage: 'linear-gradient(#22d3ee 1px, transparent 1px), linear-gradient(90deg, #22d3ee 1px, transparent 1px)', backgroundSize: '40px 40px' }}></div>
                    <div className="absolute top-6 left-1/2 -translate-x-1/2 w-[480px] h-[480px] rounded-full bg-cyan-500/5 blur-3xl pointer-events-none"></div>

                    <div className="relative w-56 h-56 md:w-72 md:h-72 mx-auto">
                        <div className="absolute inset-0 rounded-full border border-cyan-500/15 an-spin-slower">
                            <div className="absolute -top-1 left-1/2 w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_12px_#22d3ee]"></div>
                            <div className="absolute bottom-6 -left-1 w-1.5 h-1.5 rounded-full bg-cyan-600"></div>
                        </div>
                        <div className="absolute inset-5 rounded-full border border-cyan-500/25 an-spin-rev">
                            <div className="absolute top-1/2 -right-1.5 w-2.5 h-2.5 rounded-full bg-cyan-300 shadow-[0_0_10px_#67e8f9]"></div>
                            <div className="absolute top-3 left-8 w-1 h-1 rounded-full bg-cyan-500"></div>
                        </div>
                        <div className="absolute inset-11 rounded-full border border-dashed border-cyan-500/40 an-spin-slow">
                            <div className="absolute -top-1.5 left-1/2 w-3 h-3 rounded-full bg-cyan-500 an-node"></div>
                        </div>
                        <div className="absolute inset-0 flex items-center justify-center">
                            <div className="text-center">
                                <div className="text-3xl md:text-4xl font-black italic tracking-tighter text-cyan-400 drop-shadow-[0_0_14px_rgba(34,211,238,0.6)]">V.I.S.O.R.</div>
                                <div className="text-[9px] text-cyan-600 font-mono uppercase tracking-[0.35em] mt-1.5">MK-XXV 技術展示</div>
                            </div>
                        </div>
                    </div>

                    <h1 className="mt-8 text-2xl md:text-4xl font-black tracking-wide">智慧安全帽 騎士輔助系統</h1>
                    <p className="text-slate-400 text-xs md:text-sm mt-2 font-mono">ARAS · ADVANCED RIDER ASSISTANCE SYSTEM · EDGE AI</p>

                    <div className={`inline-flex items-center gap-2 mt-4 px-4 py-1.5 rounded-full border font-mono text-[11px] transition-colors ${isOver ? 'border-red-500/50 bg-red-900/30 text-red-300' : 'border-cyan-500/30 bg-cyan-900/20 text-cyan-300'}`}>
                        <span className={`w-2 h-2 rounded-full animate-pulse ${isOver ? 'bg-red-400' : 'bg-cyan-400'}`}></span>
                        <span className={statusColor}>{statusText}</span>
                    </div>

                    <div className="mt-8 grid grid-cols-2 md:grid-cols-4 gap-3 max-w-3xl mx-auto relative">
                        {stats.map((s, i) => (
                            <div key={s.label} className="card card-glow p-4 an-fade-in" style={{ animationDelay: `${i * 0.1}s` }}>
                                <div className="flex items-center gap-2 justify-center mb-1">
                                    <Icon name={s.icon} size={15} className={s.color} />
                                    <span className="text-[9px] font-mono text-slate-500 uppercase tracking-widest">{s.label}</span>
                                </div>
                                <div className={`text-3xl font-black font-mono ${s.color}`}>
                                    {s.value}<span className="text-xs text-slate-500 ml-1">{s.unit}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // ================================================================
        // AI 視覺核心
        // ================================================================
        const YoloCompareCard = () => {
            const rows = [
                { name: 'YOLOv8n', tag: 'Base', res: '640px', precision: .421, recall: .285, f1: .340, map: .298, params: '3.2M', size: '6.2MB', fps: 8, best: false },
                { name: 'YOLOv8n', tag: '優化', res: '320px', precision: .543, recall: .326, f1: .407, map: .336, params: '3.2M', size: '6.2MB', fps: 18, best: false },
                { name: 'YOLOv26n', tag: 'OURS', res: '320px', precision: .561, recall: .338, f1: .422, map: .349, params: '2.6M', size: '5.3MB', fps: 22, best: true },
            ];
            const maxFps = 25;
            const maxMap = 0.4;
            return (
                <div className="card card-glow p-5 flex flex-col">
                    <CardHeader icon="scan-search" zh="YOLO 版本對比" en="Object Detection Benchmark" live />
                    <div className="space-y-3">
                        {rows.map((r, i) => (
                            <div key={i} className={`p-3 rounded-xl border transition-colors ${r.best ? 'border-cyan-500/50 bg-cyan-950/30' : 'border-slate-700/60 bg-slate-900/40'}`}>
                                <div className="flex items-center justify-between mb-2">
                                    <div className="flex items-center gap-2">
                                        <span className={`font-black text-sm ${r.best ? 'text-cyan-300' : 'text-slate-200'}`}>{r.name}</span>
                                        <span className={`text-[8px] font-mono px-1.5 py-0.5 rounded border ${r.best ? 'bg-cyan-500 text-black border-cyan-400' : 'bg-slate-700 text-slate-300 border-slate-600'}`}>{r.tag}</span>
                                        <span className="text-[9px] font-mono text-slate-500">{r.res}</span>
                                    </div>
                                    <div className="flex items-center gap-3 text-[9px] font-mono">
                                        <span className="text-slate-500">P {r.precision}</span>
                                        <span className="text-slate-500">R {r.recall}</span>
                                        <span className="text-slate-500">F1 {r.f1}</span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="w-10 text-[9px] text-slate-500 font-mono shrink-0">FPS (Pi5)</span>
                                    <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden">
                                        <div className={`h-full rounded-full transition-all duration-1000 ${r.best ? 'bg-gradient-to-r from-cyan-500 to-cyan-300 an-shimmer' : 'bg-slate-600'}`}
                                            style={{ width: `${(r.fps / maxFps) * 100}%` }}></div>
                                    </div>
                                    <span className={`w-8 text-right text-[10px] font-black font-mono ${r.best ? 'text-cyan-300' : 'text-slate-300'}`}>~{r.fps}</span>
                                </div>
                                <div className="flex items-center gap-2 mb-1">
                                    <span className="w-10 text-[9px] text-slate-500 font-mono shrink-0">mAP@50</span>
                                    <div className="flex-1 h-2 bg-slate-800 rounded-full overflow-hidden">
                                        <div className={`h-full rounded-full transition-all duration-1000 ${r.best ? 'bg-fuchsia-400' : 'bg-slate-600'}`}
                                            style={{ width: `${(r.map / maxMap) * 100}%` }}></div>
                                    </div>
                                    <span className={`w-8 text-right text-[10px] font-black font-mono ${r.best ? 'text-fuchsia-300' : 'text-slate-300'}`}>{r.map}</span>
                                </div>
                                <div className="flex gap-3 mt-1.5 text-[9px] font-mono text-slate-500">
                                    <span>參數 <b className="text-slate-300">{r.params}</b></span>
                                    <span>檔案 <b className="text-slate-300">{r.size}</b></span>
                                    {r.best && <span className="text-cyan-400 font-bold">← 結構更輕、精度更高</span>}
                                </div>
                            </div>
                        ))}
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-700/60 text-[10px] text-slate-400 font-mono leading-relaxed">
                        實測環境：CPU-only x86 → 保守 ×3 推估 Pi 5 (Cortex-A76)。YOLOv26n 以 <b className="text-cyan-300">2.6M 參數</b> 在
                        <b className="text-cyan-300"> 320px</b> 輸入下達成 <b className="text-cyan-300">20-25 FPS</b>，適合邊緣部署。
                    </div>
                </div>
            );
        };

        const TrainingPipelineCard = () => {
            const steps = [
                { icon: 'database', name: 'BDD100K 資料集', sub: '10 萬張 · 多元場景', color: 'text-blue-400' },
                { icon: 'video', name: '實拍抽幀 1fps', sub: '實際道路行車影像', color: 'text-emerald-400' },
                { icon: 'sparkles', name: 'Stable Diffusion', sub: 'Img2Img 風格轉換', color: 'text-fuchsia-400' },
                { icon: 'wand-2', name: 'cv2 環境模擬', sub: '相機雜訊 · 動態模糊', color: 'text-amber-400' },
                { icon: 'brain-circuit', name: 'YOLOv8n 二次訓練', sub: '6 類台灣交通標註', color: 'text-cyan-400' },
                { icon: 'box', name: '量化 / ONNX 部署', sub: 'FP16 · INT8 → Pi 5', color: 'text-orange-400' },
            ];
            return (
                <div className="card card-glow p-5 flex flex-col">
                    <CardHeader icon="workflow" zh="Dataset 訓練流水線" en="Data → Augmentation → Train" live />
                    <div className="flex-1">
                        {steps.map((s, i) => (
                            <div key={s.name} className="relative flex items-center gap-3 pb-4">
                                {i < steps.length - 1 && (
                                    <div className="absolute left-[17px] top-10 bottom-0 w-0.5 bg-slate-800 overflow-visible">

            useEffect(() => {

                    { p: 60, s: "UPLOADING TACTICAL DATABASE..." },

                const progressBar = document.getElementById('boot-progress-bar');
                const statusText = document.getElementById('boot-status');
                const bootScreen = document.getElementById('visor-boot-screen');
                let currentStage = 0;
                const runBoot = () => {
                    if (currentStage < stages.length) {
                        const stage = stages[currentStage];
                        if (progressBar) progressBar.style.width = `${stage.p}%`;
                        if (statusText) statusText.innerText = stage.s;
                        setTimeout(() => { currentStage++; runBoot(); }, 500 + Math.random() * 600);

                        setTimeout(() => {
                            if (bootScreen) {
                                bootScreen.style.opacity = '0';
                                setTimeout(() => {
                                    bootScreen.style.display = 'none';
                                    setIsBooting(false);
                                }, 1000);
                            }
                        }, 500);
                    }
                };
                runBoot();
            }, []);
